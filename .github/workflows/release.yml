name: Build and Release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  quality:
    name: Test and check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test

  binaries:
    name: Build ${{ matrix.name }}
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: node22-macos-arm64
            name: isingq-mcp-darwin-arm64
          - runner: macos-15-intel
            target: node22-macos-x64
            name: isingq-mcp-darwin-x64
          - runner: ubuntu-24.04
            target: node22-linux-x64
            name: isingq-mcp-linux-x64
          - runner: ubuntu-24.04-arm
            target: node22-linux-arm64
            name: isingq-mcp-linux-arm64
          - runner: windows-2025
            target: node22-win-x64
            name: isingq-mcp-windows-x64.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build:binaries -- --target ${{ matrix.target }}
      - run: node scripts/smoke-binary.js dist/${{ matrix.name }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: dist/${{ matrix.name }}
          if-no-files-found: error
          compression-level: 0

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: binaries
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Verify version and create checksums
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./package.json').version")"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$package_version" != "$tag_version" ]]; then
            echo "Release 版本不一致（package.json=$package_version, tag=$GITHUB_REF_NAME）" >&2
            exit 1
          fi
          node scripts/create-release-metadata.js
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          dist/isingq-mcp-darwin-arm64
          dist/isingq-mcp-darwin-x64
          dist/isingq-mcp-linux-arm64
          dist/isingq-mcp-linux-x64
          dist/isingq-mcp-windows-x64.exe
          dist/manifest.json
          dist/SHA256SUMS
          --verify-tag
          --generate-notes
          --title "IsingQ Toolkit ${{ github.ref_name }}"
